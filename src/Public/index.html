<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrar Persona</title>
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap">
    <style>
        :root {
            --primary: #8b5cf6;
            --primary-dark: #7c3aed;
            --secondary: #f59e0b;
            --accent: #06b6d4;
            --success: #10b981;
            --error: #ef4444;
            --text: #1f2937;
            --text-light: #6b7280;
            --glass: rgba(255, 255, 255, 0.25);
            --glass-border: rgba(255, 255, 255, 0.18);
            --shadow-glow: 0 8px 32px 0 rgba(31, 38, 135, 0.37);
            --radius: 16px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 25%, #f093fb 50%, #f5576c 75%, #4facfe 100%);
            background-size: 400% 400%;
            animation: gradientShift 15s ease infinite;
            color: var(--text);
            line-height: 1.6;
            min-height: 100vh;
            padding: 2rem;
            position: relative;
            overflow-x: hidden;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' fill-rule='evenodd'%3E%3Cg fill='%23ffffff' fill-opacity='0.1'%3E%3Ccircle cx='30' cy='30' r='2'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E") repeat;
            pointer-events: none;
            z-index: 1;
        }

        @keyframes gradientShift {
            0% {
                background-position: 0% 50%;
            }

            50% {
                background-position: 100% 50%;
            }

            100% {
                background-position: 0% 50%;
            }
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            position: relative;
            z-index: 2;
        }

        .floating-shapes {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
        }

        .shape {
            position: absolute;
            background: linear-gradient(45deg, rgba(139, 92, 246, 0.3), rgba(245, 158, 11, 0.3));
            border-radius: 50%;
            animation: float 20s infinite linear;
        }

        .shape:nth-child(1) {
            width: 80px;
            height: 80px;
            top: 20%;
            left: 10%;
            animation-delay: 0s;
        }

        .shape:nth-child(2) {
            width: 120px;
            height: 120px;
            top: 60%;
            right: 10%;
            animation-delay: -5s;
        }

        .shape:nth-child(3) {
            width: 60px;
            height: 60px;
            top: 80%;
            left: 20%;
            animation-delay: -10s;
        }

        @keyframes float {
            0% {
                transform: translateY(0px) rotate(0deg);
            }

            33% {
                transform: translateY(-30px) rotate(120deg);
            }

            66% {
                transform: translateY(30px) rotate(240deg);
            }

            100% {
                transform: translateY(0px) rotate(360deg);
            }
        }

        .header {
            text-align: center;
            margin-bottom: 3rem;
            position: relative;
        }

        .header h1 {
            font-size: 3.5rem;
            font-weight: 900;
            background: linear-gradient(135deg, #667eea, #764ba2, #f093fb);
            background-clip: text;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 1rem;
            text-shadow: 0 0 30px rgba(139, 92, 246, 0.5);
            animation: glow 2s ease-in-out infinite alternate;
        }

        @keyframes glow {
            from {
                filter: drop-shadow(0 0 20px rgba(139, 92, 246, 0.5));
            }

            to {
                filter: drop-shadow(0 0 30px rgba(245, 158, 11, 0.8));
            }
        }

        .header p {
            color: white;
            font-size: 1.2rem;
            font-weight: 500;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.3);
        }

        .header h1 {
            font-size: 3.5rem;
            font-weight: 900;
            background: linear-gradient(135deg, #667eea, #764ba2, #f093fb);
            -webkit-background-clip: text;
            /* Pon primero la versión con prefijo */
            background-clip: text;
            /* Luego la versión estándar */
            -webkit-text-fill-color: transparent;
            margin-bottom: 1rem;
            text-shadow: 0 0 30px rgba(139, 92, 246, 0.5);
            animation: glow 2s ease-in-out infinite alternate;
        }

        .glass-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 20px 40px 0 rgba(31, 38, 135, 0.5);
        }

        .glass-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
            transition: left 0.5s;
        }

        .glass-card:hover::before {
            left: 100%;
        }

        .card-header {
            background: linear-gradient(135deg, rgba(139, 92, 246, 0.8), rgba(245, 158, 11, 0.8));
            color: white;
            padding: 2rem;
            font-size: 1.5rem;
            font-weight: 700;
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        .card-header::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: linear-gradient(45deg, transparent, rgba(255, 255, 255, 0.1), transparent);
            animation: shimmer 3s infinite;
        }

        @keyframes shimmer {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }

        .card-body {
            padding: 2.5rem;
            position: relative;
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 2rem;
        }

        @media (max-width: 768px) {
            .form-grid {
                grid-template-columns: 1fr;
            }
        }

        .form-group {
            margin-bottom: 2rem;
            position: relative;
        }

        label {
            display: block;
            margin-bottom: 0.75rem;
            font-weight: 600;
            color: white;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.3);
            font-size: 1.1rem;
        }

        .required::after {
            content: "*";
            color: #ff6b6b;
            margin-left: 6px;
            font-size: 1.2rem;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% {
                opacity: 1;
            }

            50% {
                opacity: 0.5;
            }

            100% {
                opacity: 1;
            }
        }

        .input-container {
            position: relative;
        }

        input {
            width: 100%;
            padding: 1rem 1.25rem;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 12px;
            font-size: 1rem;
            font-family: inherit;
            font-weight: 500;
            background: rgba(255, 255, 255, 0.9);
            -webkit-backdrop-filter: blur(10px);
            /* ¡Agrega esta línea! */
            backdrop-filter: blur(10px);
            transition: all 0.3s ease;
            color: var(--text);
        }

        input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 4px rgba(139, 92, 246, 0.3), 0 0 20px rgba(139, 92, 246, 0.5);
            transform: translateY(-2px);
        }

        input::placeholder {
            color: var(--text-light);
            font-weight: 400;
        }

        .btn {
            display: inline-block;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: white;
            border: none;
            padding: 1rem 2rem;
            font-size: 1.1rem;
            font-weight: 700;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-align: center;
            text-decoration: none;
            position: relative;
            overflow: hidden;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.3), transparent);
            transition: left 0.5s;
        }

        .btn:hover::before {
            left: 100%;
        }

        .btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 25px rgba(139, 92, 246, 0.4);
        }

        .btn:active {
            transform: translateY(-1px);
        }

        .btn-block {
            display: block;
            width: 100%;
        }

        .btn-mega {
            padding: 1.25rem 2.5rem;
            font-size: 1.3rem;
            border-radius: 16px;
            background: linear-gradient(135deg, #ff6b6b, #4ecdc4, #45b7d1, #96ceb4, #feca57);
            background-size: 300% 300%;
            animation: gradientShift 3s ease infinite;
        }

        .card-footer {
            background: rgba(255, 255, 255, 0.1);
            padding: 2rem;
            border-top: 1px solid rgba(255, 255, 255, 0.2);
            display: flex;
            justify-content: center;
        }

        #message {
            margin-top: 1.5rem;
            padding: 1.25rem;
            border-radius: 12px;
            font-weight: 600;
            display: none;
            text-align: center;
            font-size: 1.1rem;
        }

        #message.success {
            background: linear-gradient(135deg, rgba(16, 185, 129, 0.9), rgba(6, 182, 212, 0.9));
            color: white;
            border: 2px solid rgba(16, 185, 129, 0.5);
            display: block;
            animation: successPulse 0.5s ease-in-out;
        }

        #message.error {
            background: linear-gradient(135deg, rgba(239, 68, 68, 0.9), rgba(245, 101, 101, 0.9));
            color: white;
            border: 2px solid rgba(239, 68, 68, 0.5);
            display: block;
            animation: errorShake 0.5s ease-in-out;
        }

        @keyframes successPulse {
            0% {
                transform: scale(0.95);
            }

            50% {
                transform: scale(1.05);
            }

            100% {
                transform: scale(1);
            }
        }

        @keyframes errorShake {

            0%,
            100% {
                transform: translateX(0);
            }

            25% {
                transform: translateX(-5px);
            }

            75% {
                transform: translateX(5px);
            }
        }

        .link-container {
            text-align: center;
            margin-top: 2rem;
        }

        .neon-link {
            color: White;
            text-decoration: none;
            font-weight: 600;
            display: inline-flex;
            align-items: center;
            transition: all 0.3s ease;
            padding: 0.75rem 1.5rem;
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.1);
            -webkit-backdrop-filter: blur(10px);
            /* ¡Agrega esta línea! */
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            font-size: 1.1rem;
        }

        .neon-link:hover {
            color: var(--accent);
            text-shadow: 0 0 10px var(--accent);
            box-shadow: 0 0 20px rgba(6, 182, 212, 0.5);
            transform: translateY(-2px);
        }

        .neon-link svg {
            margin-left: 0.75rem;
            width: 20px;
            height: 20px;
            transition: transform 0.3s ease;
        }

        .neon-link:hover svg {
            transform: translateX(5px);
        }

        .animate-fade-in {
            animation: fadeInUp 0.8s ease-out;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .sparkle {
            position: absolute;
            width: 4px;
            height: 4px;
            background: white;
            border-radius: 50%;
            animation: sparkle 2s infinite;
        }

        @keyframes sparkle {

            0%,
            100% {
                opacity: 0;
                transform: scale(0);
            }

            50% {
                opacity: 1;
                transform: scale(1);
            }
        }

        .sparkle:nth-child(1) {
            top: 20%;
            left: 20%;
            animation-delay: 0s;
        }

        .sparkle:nth-child(2) {
            top: 40%;
            right: 30%;
            animation-delay: 0.5s;
        }

        .sparkle:nth-child(3) {
            bottom: 30%;
            left: 40%;
            animation-delay: 1s;
        }

        .sparkle:nth-child(4) {
            bottom: 20%;
            right: 20%;
            animation-delay: 1.5s;
        }

        @media (max-width: 768px) {
            .header h1 {
                font-size: 2.5rem;
            }

            body {
                padding: 1rem;
            }

            .card-body {
                padding: 1.5rem;
            }
        }
    </style>
</head>

<body>
    <div class="floating-shapes">
        <div class="shape"></div>
        <div class="shape"></div>
        <div class="shape"></div>
    </div>

    <div class="container animate-fade-in">
        <div class="header">
            <h1>🚀 Registro de Persona</h1>
            <p>✨ Complete el formulario para registrar una nueva persona en el sistema ✨</p>
        </div>

        <div class="glass-card">
            <div class="sparkle"></div>
            <div class="sparkle"></div>
            <div class="sparkle"></div>
            <div class="sparkle"></div>

            <div class="card-header">
                🎯 Información Personal
            </div>
            <div class="card-body">
                <form id="personaForm">
                    <div class="form-grid">
                        <div class="form-group">
                            <label for="primer_nombre" class="required">👤 Primer Nombre</label>
                            <div class="input-container">
                                <input type="text" id="primer_nombre" name="primer_nombre" required
                                    placeholder="Ingrese primer nombre">
                            </div>
                        </div>

                        <div class="form-group">
                            <label for="segundo_nombre">👤 Segundo Nombre</label>
                            <div class="input-container">
                                <input type="text" id="segundo_nombre" name="segundo_nombre"
                                    placeholder="Ingrese segundo nombre (opcional)">
                            </div>
                        </div>

                        <div class="form-group">
                            <label for="primer_apellido" class="required">👨‍👩‍👧‍👦 Primer Apellido</label>
                            <div class="input-container">
                                <input type="text" id="primer_apellido" name="primer_apellido" required
                                    placeholder="Ingrese primer apellido">
                            </div>
                        </div>

                        <div class="form-group">
                            <label for="segundo_apellido">👨‍👩‍👧‍👦 Segundo Apellido</label>
                            <div class="input-container">
                                <input type="text" id="segundo_apellido" name="segundo_apellido"
                                    placeholder="Ingrese segundo apellido (opcional)">
                            </div>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="n_documento" class="required">🆔 Número de Documento</label>
                        <div class="input-container">
                            <input type="text" id="n_documento" name="n_documento" required
                                placeholder="Ingrese número de documento">
                        </div>
                    </div>

                    <div id="message"></div>

                    <div class="card-footer">
                        <button type="submit" class="btn btn-mega btn-block">💾 Guardar Persona</button>
                    </div>
                </form>
            </div>
        </div>

        <div class="link-container">
            <a href="personas.html" class="neon-link">
                📋 Ver todas las personas
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M14 5l7 7m0 0l-7 7m7-7H3" />
                </svg>
            </a>
        </div>
    </div>

    <script src="./js/api.js"></script>
    <script src="./js/main.js"></script>
</body>

</html>
