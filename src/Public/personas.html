<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Listado de Personas</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 2rem;
        }
        ul {
            list-style: none;
            padding: 0;
        }
        li {
            background-color: #f0f0f0;
            margin-bottom: 0.5rem;
            padding: 1rem;
            border-radius: 4px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        li button {
            margin-left: 10px;
            padding: 8px 12px;
            cursor: pointer;
        }
        #message {
            margin-top: 1rem;
            padding: 0.5rem;
            border: 1px solid #ccc;
            background-color: #f9f9f9;
            display: none;
        }
        #message.success {
            background-color: #d4edda;
            color: #155724;
            border-color: #c3e6cb;
            display: block;
        }
        #message.error {
            background-color: #f8d7da;
            color: #721c24;
            border-color: #f5c6cb;
            display: block;
        }
    </style>
</head>
<body>
    <h1>Listado de Personas</h1>

    <div id="personasList">
        <p>Cargando personas...</p>
    </div>

    <div id="message"></div>

    <hr>
    <p><a href="index.html">Crear nueva persona</a></p>

    <script src="./js/api.js"></script>
    <script src="./js/main.js"></script>
</body>
</html>
