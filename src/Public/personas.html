<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Listado de Personas</title>
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap">
    <style>
        :root {
            --primary: #8b5cf6;
            --primary-dark: #7c3aed;
            --secondary: #f59e0b;
            --accent: #06b6d4;
            --success: #10b981;
            --error: #ef4444;
            --text: #1f2937;
            --text-light: #6b7280;
            --glass: rgba(255, 255, 255, 0.25);
            --glass-border: rgba(255, 255, 255, 0.18);
            --shadow-glow: 0 8px 32px 0 rgba(31, 38, 135, 0.37);
            --radius: 16px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 25%, #f093fb 50%, #f5576c 75%, #4facfe 100%);
            background-size: 400% 400%;
            animation: gradientShift 15s ease infinite;
            color: var(--text);
            line-height: 1.6;
            min-height: 100vh;
            padding: 2rem;
            position: relative;
            overflow-x: hidden;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' fill-rule='evenodd'%3E%3Cg fill='%23ffffff' fill-opacity='0.1'%3E%3Ccircle cx='30' cy='30' r='2'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E") repeat;
            pointer-events: none;
            z-index: 1;
        }

        @keyframes gradientShift {
            0% {
                background-position: 0% 50%;
            }

            50% {
                background-position: 100% 50%;
            }

            100% {
                background-position: 0% 50%;
            }
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            position: relative;
            z-index: 2;
        }

        .floating-shapes {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
        }

        .shape {
            position: absolute;
            background: linear-gradient(45deg, rgba(139, 92, 246, 0.3), rgba(245, 158, 11, 0.3));
            border-radius: 50%;
            animation: float 20s infinite linear;
        }

        .shape:nth-child(1) {
            width: 100px;
            height: 100px;
            top: 15%;
            left: 5%;
            animation-delay: 0s;
        }

        .shape:nth-child(2) {
            width: 150px;
            height: 150px;
            top: 70%;
            right: 5%;
            animation-delay: -7s;
        }

        .shape:nth-child(3) {
            width: 80px;
            height: 80px;
            top: 40%;
            left: 80%;
            animation-delay: -14s;
        }

        @keyframes float {
            0% {
                transform: translateY(0px) rotate(0deg);
            }

            33% {
                transform: translateY(-40px) rotate(120deg);
            }

            66% {
                transform: translateY(40px) rotate(240deg);
            }

            100% {
                transform: translateY(0px) rotate(360deg);
            }
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 3rem;
            flex-wrap: wrap;
            gap: 2rem;
        }

        .header-title h1 {
            font-size: 3.5rem;
            font-weight: 900;
            background: linear-gradient(135deg, #667eea, #764ba2, #f093fb);
            -webkit-background-clip: text;
            /* ¡Esta línea debe ir primero! */
            background-clip: text;
            /* Y esta línea después */
            -webkit-text-fill-color: transparent;
            margin-bottom: 0.5rem;
            animation: glow 2s ease-in-out infinite alternate;
        }

        @keyframes glow {
            from {
                filter: drop-shadow(0 0 20px rgba(139, 92, 246, 0.5));
            }

            to {
                filter: drop-shadow(0 0 30px rgba(245, 158, 11, 0.8));
            }
        }

        .header-title p {
            color: white;
            font-size: 1.2rem;
            font-weight: 500;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.3);
        }

        .glass-card {
            background: var(--glass);
            -webkit-backdrop-filter: blur(20px);
            /* ¡Esta línea va primero! */
            backdrop-filter: blur(20px);
            /* Y esta línea después */
            border-radius: var(--radius);
            border: 1px solid var(--glass-border);
            box-shadow: var(--shadow-glow);
            overflow: hidden;
            margin-bottom: 2rem;
            position: relative;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .glass-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 20px 40px 0 rgba(31, 38, 135, 0.5);
        }

        .card-header {
            background: linear-gradient(135deg, rgba(139, 92, 246, 0.8), rgba(245, 158, 11, 0.8));
            color: white;
            padding: 2rem;
            font-size: 1.5rem;
            font-weight: 700;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: relative;
            overflow: hidden;
        }

        .card-header::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: linear-gradient(45deg, transparent, rgba(255, 255, 255, 0.1), transparent);
            animation: shimmer 3s infinite;
        }

        @keyframes shimmer {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }

        .search-container {
            position: relative;
            width: 350px;
        }

        .search-input {
            width: 100%;
            padding: 0.75rem 1rem 0.75rem 3rem;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 12px;
            font-size: 1rem;
            font-family: inherit;
            font-weight: 500;
            background: rgba(255, 255, 255, 0.9);
            -webkit-backdrop-filter: blur(10px);
            /* ¡Agrega esta línea! */
            backdrop-filter: blur(10px);
            transition: all 0.3s ease;
            color: var(--text);
        }

        .search-input:focus {
            outline: none;
            border-color: white;
            box-shadow: 0 0 0 4px rgba(255, 255, 255, 0.3), 0 0 20px rgba(255, 255, 255, 0.5);
        }

        .search-icon {
            position: absolute;
            left: 1rem;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-light);
            z-index: 3;
        }

        .card-body {
            padding: 2rem;
        }

        .person-list {
            list-style: none;
        }

        .person-item {
            background: rgba(255, 255, 255, 0.9);
            -webkit-backdrop-filter: blur(10px);
            /* ¡Agrega esta línea para compatibilidad con Safari! */
            backdrop-filter: blur(10px);
            border-radius: 12px;
            padding: 1.5rem;
            margin-bottom: 1.5rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: 2px solid rgba(255, 255, 255, 0.3);
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .person-item::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(139, 92, 246, 0.1), transparent);
            transition: left 0.5s;
        }

        .person-item:hover::before {
            left: 100%;
        }

        .person-item:hover {
            transform: translateY(-5px) scale(1.02);
            box-shadow: 0 15px 30px rgba(139, 92, 246, 0.3);
            border-color: var(--primary);
        }

        .person-info {
            flex: 1;
            position: relative;
            z-index: 2;
        }

        .person-name {
            font-weight: 700;
            font-size: 1.3rem;
            margin-bottom: 0.5rem;
            color: var(--text);
            text-shadow: 0 1px 2px rgba(0, 0, 0, 0.1);
        }

        .person-document {
            color: var(--text-light);
            font-size: 1rem;
            font-weight: 500;
        }

        .person-actions {
            display: flex;
            gap: 1rem;
            position: relative;
            z-index: 2;
        }

        .btn {
            display: inline-block;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: white;
            border: none;
            padding: 0.75rem 1.5rem;
            font-size: 1rem;
            font-weight: 600;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-align: center;
            text-decoration: none;
            position: relative;
            overflow: hidden;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.3), transparent);
            transition: left 0.5s;
        }

        .btn:hover::before {
            left: 100%;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(139, 92, 246, 0.4);
        }

        .btn-sm {
            padding: 0.6rem 1.2rem;
            font-size: 0.9rem;
        }

        .btn-mega {
            padding: 1rem 2rem;
            font-size: 1.1rem;
            border-radius: 12px;
            background: linear-gradient(135deg, #ff6b6b, #4ecdc4, #45b7d1);
            background-size: 200% 200%;
            animation: gradientShift 3s ease infinite;
        }

        .btn-danger {
            background: linear-gradient(135deg, var(--error), #ff6b6b);
        }

        .btn-outline {
            background: transparent;
            border: 2px solid var(--primary);
            color: var(--primary);
            -webkit-backdrop-filter: blur(10px);
            /* ¡Agrega esta línea! */
            backdrop-filter: blur(10px);
        }

        .btn-outline:hover {
            background: rgba(139, 92, 246, 0.1);
            color: white;
            border-color: white;
        }

        #message {
            margin-top: 1.5rem;
            padding: 1.25rem;
            border-radius: 12px;
            font-weight: 600;
            display: none;
            text-align: center;
            font-size: 1.1rem;
        }

        #message.success {
            background: linear-gradient(135deg, rgba(16, 185, 129, 0.9), rgba(6, 182, 212, 0.9));
            color: white;
            border: 2px solid rgba(16, 185, 129, 0.5);
            display: block;
            animation: successPulse 0.5s ease-in-out;
        }

        #message.error {
            background: linear-gradient(135deg, rgba(239, 68, 68, 0.9), rgba(245, 101, 101, 0.9));
            color: white;
            border: 2px solid rgba(239, 68, 68, 0.5);
            display: block;
            animation: errorShake 0.5s ease-in-out;
        }

        @keyframes successPulse {
            0% {
                transform: scale(0.95);
            }

            50% {
                transform: scale(1.05);
            }

            100% {
                transform: scale(1);
            }
        }

        @keyframes errorShake {

            0%,
            100% {
                transform: translateX(0);
            }

            25% {
                transform: translateX(-5px);
            }

            75% {
                transform: translateX(5px);
            }
        }

        .empty-state {
            text-align: center;
            padding: 4rem 2rem;
        }

        .empty-state-icon {
            font-size: 4rem;
            margin-bottom: 1.5rem;
            animation: bounce 2s infinite;
        }

        @keyframes bounce {

            0%,
            20%,
            50%,
            80%,
            100% {
                transform: translateY(0);
            }

            40% {
                transform: translateY(-10px);
            }

            60% {
                transform: translateY(-5px);
            }
        }

        .empty-state-text {
            color: white;
            font-size: 1.3rem;
            font-weight: 600;
            margin-bottom: 2rem;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.3);
        }

        .link-container {
            text-align: center;
            margin-top: 2rem;
        }

        .neon-link {
            color: white;
            text-decoration: none;
            font-weight: 600;
            display: inline-flex;
            align-items: center;
            transition: all 0.3s ease;
            padding: 1rem 2rem;
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.1);
            -webkit-backdrop-filter: blur(10px);
            /* ¡Agrega esta línea para compatibilidad con Safari! */
            backdrop-filter: blur(10px);
            border: 2px solid rgba(255, 255, 255, 0.2);
            font-size: 1.1rem;
        }

        .neon-link:hover {
            color: var(--accent);
            text-shadow: 0 0 15px var(--accent);
            box-shadow: 0 0 30px rgba(6, 182, 212, 0.5);
            transform: translateY(-3px);
            border-color: var(--accent);
        }

        .neon-link svg {
            margin-right: 0.75rem;
            width: 20px;
            height: 20px;
            transition: transform 0.3s ease;
        }

        .neon-link:hover svg {
            transform: translateX(-5px);
        }

        .loading {
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 3rem;
        }

        .loading-spinner {
            width: 60px;
            height: 60px;
            border: 6px solid rgba(139, 92, 246, 0.2);
            border-radius: 50%;
            border-top-color: var(--primary);
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }

        .animate-fade-in {
            animation: fadeInUp 0.8s ease-out;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @media (max-width: 768px) {
            .header {
                flex-direction: column;
                align-items: center;
            }

            .header-title h1 {
                font-size: 2.5rem;
                text-align: center;
            }

            .search-container {
                width: 100%;
            }

            .person-item {
                flex-direction: column;
                align-items: flex-start;
                text-align: center;
            }

            .person-actions {
                margin-top: 1.5rem;
                width: 100%;
                justify-content: center;
            }

            body {
                padding: 1rem;
            }
        }
    </style>
</head>

<body>
    <div class="floating-shapes">
        <div class="shape"></div>
        <div class="shape"></div>
        <div class="shape"></div>
    </div>

    <div class="container animate-fade-in">
        <div class="header">
            <div class="header-title">
                <h1>📋 Listado de Personas</h1>
                <p>🎯 Gestione las personas registradas en el sistema</p>
            </div>
            <a href="index.html" class="btn btn-mega">
                ➕ Registrar Nueva Persona
            </a>
        </div>

        <div class="glass-card">
            <div class="card-header">
                <span>👥 Personas Registradas</span>
                <div class="search-container">
                    <input type="text" id="searchInput" class="search-input"
                        placeholder="🔍 Buscar por nombre o documento...">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="none" viewBox="0 0 24 24"
                        stroke="currentColor" class="search-icon">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
                    </svg>
                </div>
            </div>
            <div class="card-body">
                <div id="personasList" class="person-list">
                    <div class="loading">
                        <div class="loading-spinner"></div>
                    </div>
                </div>
            </div>
        </div>

        <div id="message"></div>

        <div class="link-container">
            <a href="index.html" class="neon-link">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M10 19l-7-7m0 0l7-7m-7 7h18" />
                </svg>
                🏠 Volver al formulario de registro
            </a>
        </div>
    </div>

    <script src="./js/api.js"></script>
    <script src="./js/main.js"></script>
    <script>
        // Funcionalidad de búsqueda mejorada
        document.getElementById('searchInput').addEventListener('input', function (e) {
            const searchTerm = e.target.value.toLowerCase();
            const personItems = document.querySelectorAll('.person-item');

            personItems.forEach((item, index) => {
                const personText = item.querySelector('.person-info').textContent.toLowerCase();
                if (personText.includes(searchTerm)) {
                    item.style.display = 'flex';
                    item.style.animationDelay = `${index * 0.1}s`;
                    item.classList.add('animate-fade-in');
                } else {
                    item.style.display = 'none';
                }
            });
        });
    </script>
</body>

</html>
