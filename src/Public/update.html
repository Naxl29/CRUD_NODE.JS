<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar Persona</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 2rem;
        }
        form {
            max-width: 400px;
            margin: auto;
        }
        input, label, button {
            display: block;
            width: 100%;
            margin-bottom: 1rem;
        }
        #message {
            margin-top: 1rem;
            padding: 0.5rem;
            border: 1px solid #ccc;
            background-color: #f9f9f9;
            display: none;
        }
        #message.success {
            background-color: #d4edda;
            color: #155724;
            border-color: #c3e6cb;
            display: block;
        }
        #message.error {
            background-color: #f8d7da;
            color: #721c24;
            border-color: #f5c6cb;
            display: block;
        }
    </style>
</head>
<body>
    <h1>Editar Persona</h1>

    <form id="editPersonaForm">
        <label for="edit_primer_nombre">Primer Nombre:</label>
        <input type="text" id="edit_primer_nombre" name="edit_primer_nombre" required>

        <label for="edit_segundo_nombre">Segundo Nombre:</label>
        <input type="text" id="edit_segundo_nombre" name="edit_segundo_nombre">

        <label for="edit_primer_apellido">Primer Apellido:</label>
        <input type="text" id="edit_primer_apellido" name="edit_primer_apellido" required>

        <label for="edit_segundo_apellido">Segundo Apellido:</label>
        <input type="text" id="edit_segundo_apellido" name="edit_segundo_apellido">

        <label for="edit_n_documento">Número de Documento:</label>
        <input type="text" id="edit_n_documento" name="edit_n_documento" required>

        <button type="submit">Actualizar Persona</button>
    </form>

    <div id="message"></div>

    <hr>
    <p><a href="personas.html">Volver al listado de personas</a></p>

    <script src="./js/api.js"></script>
    <script src="./js/main.js"></script>
</body>
</html>
